<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои пароли</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Мои сохраненные пароли</h1>

        {% if passwords %}
            <div class="passwords-list">
                {% for item in passwords %}
                <div class="password-item">

                    <div class="website">{{ item.website }}</div>
                    <div class="login1">{{ item.login1 }}</div>
                    <div class="password">{{ item.password }}</div>
                </div>



                {% endfor %}
            </div>
        {% else %}
            <div class="no-passwords">
                <p>У вас нет сохраненных паролей.</p>
            </div>
        {% endif %}

        <div class="links">
            <a href="{{ url_for('index') }}">Генератор</a> |
            <a href="{{ url_for('logout') }}">Выйти из системы</a>
        </div>
    </div>
<footer class="site-footer">
        <p>&copy; 2025 Макаров. Все права защищены.</p>
    </footer>
</body>
</html>
